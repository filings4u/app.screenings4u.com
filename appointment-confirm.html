<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Review Appointment | screenings4u</title><style>body{margin:0;background:#eff3f8;color:#17365f;font:15px/1.6 Arial,sans-serif}.bar{height:8px;background:#ff6b00}main{max-width:710px;margin:45px auto;padding:32px;background:white;border:1px solid #dce5ef;border-radius:16px;box-shadow:0 12px 35px #16345d16}h1{font-size:27px;color:#325aa3;margin:0 0 5px}h2{font-size:19px}.detail{padding:14px 0;border-bottom:1px solid #e7edf5}.label{font-size:12px;color:#637995;text-transform:uppercase;font-weight:bold}button{background:#ff6b00;color:white;font:bold 15px Arial;border:0;border-radius:8px;padding:14px 22px;cursor:pointer;margin-top:20px}button:disabled{opacity:.5;cursor:default}.foot{color:#637995;font-size:12px;margin-top:26px}@media(max-width:760px){main{margin:15px;padding:20px}}</style></head><body><div class="bar"></div><main><p style="font-weight:bold;color:#325aa3">screenings4u | Appointment Confirmation</p><h1>Review your appointment</h1><p>Please review the details before confirming.</p><div id="info" role="status">Loading appointment details…</div><button id="confirm" hidden>Confirm Appointment</button><p id="status" role="status"></p><p class="foot">This confirmation link is personal and may expire. For changes, contact your screenings4u coordinator.</p></main><script>
(async()=>{
const info=document.getElementById("info"),status=document.getElementById("status"),btn=document.getElementById("confirm"),token=new URLSearchParams(location.search).get("token")||"";
history.replaceState(null,"",location.pathname);
const endpoint="https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/management-task-customer-confirm";
const request=async action=>{const r=await fetch(endpoint,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify({action,token})});const data=await r.json();if(!r.ok)throw Error(data.error||"Unable to process request");return data};
const row=(label,value)=>{const d=document.createElement("div");d.className="detail";const l=document.createElement("div");l.className="label";l.textContent=label;const v=document.createElement("div");v.textContent=value||"Not provided";d.append(l,v);return d};
try{const d=await request("view");info.replaceChildren(row("Event",d.event.title),row("Date & time",d.event.start_at?new Date(d.event.start_at).toLocaleString():"Not provided"),row("Location",d.event.location),row("Details",d.event.description));if(d.status==="confirmed"){status.textContent="Your appointment is already confirmed."}else if(d.status==="pending"){btn.hidden=false}else status.textContent="This confirmation request is "+d.status}
catch(e){info.textContent=e.message}
btn.onclick=async()=>{btn.disabled=true;try{const d=await request("confirm");btn.hidden=true;status.textContent="Your appointment is confirmed. Your coordinator has a record of your response."}catch(e){status.textContent=e.message;btn.disabled=false}}
})();
</script></body></html>
