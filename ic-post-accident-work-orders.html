<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IC Network | Post-Accident Work Orders</title><style>body{background:#edf2f8;color:#17365f;font:15px Arial;margin:0}header{background:#102f55;color:white;padding:24px}main{max-width:1040px;margin:25px auto;background:white;padding:28px;border-radius:12px}input,textarea,select{padding:10px;border:1px solid #aebed0;border-radius:6px;box-sizing:border-box;width:100%}label{display:block;margin:12px 0 4px;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}button{padding:12px 18px;background:#153e75;color:white;border:0;border-radius:6px;cursor:pointer;margin:16px 8px 4px 0}table{border-collapse:collapse;width:100%;margin-top:20px}td,th{border-bottom:1px solid #e2e8f0;padding:10px;text-align:left}a{color:#153e75}@media(max-width:700px){.grid{display:block}main{margin:8px;padding:15px}}</style></head><body><header><strong>workforce | screenings4u — IC Network</strong></header><main><h1>Post-Accident Work Orders</h1><p><a href="https://independent-contractor.screenings4u.com/">Open IC Portal</a></p><p><a href="post-accident-requests.html">Guest post-accident forms</a></p><p>Create an assignment, find an active IC by area, and email an approval offer. Full assignment details stay private until accepted.</p><form id="form"><div class="grid"><div><label>Assignment title</label><input id="title" required></div><div><label>City</label><input id="city" required></div><div><label>State</label><input id="state" required></div><div><label>ZIP</label><input id="postal_code"></div><div><label>Full service address (confidential)</label><input id="site_address" required></div><div><label>Incident date</label><input id="event_date" type="date"></div><div><label>IC compensation ($)</label><input id="compensation" type="number" min="0" step=".01" value="0"></div><div><label>Site contact name (confidential)</label><input id="contact_name"></div><div><label>Site contact phone (confidential)</label><input id="contact_phone"></div></div><label>Incident details (confidential)</label><textarea id="incident_details"></textarea><label>Assignment instructions (confidential)</label><textarea id="notes"></textarea><button>Create Work Order</button></form><p id="message"></p><h2>Find ICs in the area</h2><button id="search">Search Available IC Network</button><div id="results"></div><h2>Work orders</h2><div id="orders"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/dot-config.js?v=12"></script><script src="assets/js/dot-auth.js?v=20261006-fast1"></script><script>const endpoint='https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/workforce-post-accident-ic-orders', $=id=>document.getElementById(id);let currentId=null;async function token(){await DOTAuth.requireAuth();for(const k of Object.keys(localStorage))if(k.startsWith('sb-')&&k.endsWith('-auth-token')){try{const x=JSON.parse(localStorage.getItem(k));if(x.access_token)return x.access_token}catch{}}throw Error('Staff login session not found')}async function api(action,extra={}){const jwt=await token(),r=await fetch(endpoint,{method:'POST',headers:{authorization:'Bearer '+jwt,'content-type':'application/json'},body:JSON.stringify({action,...extra})}),j=await r.json();if(!r.ok)throw Error(j.error||'Request failed');return j}const esc=x=>String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));async function list(){try{const r=await api('list');$('orders').innerHTML='<table><tr><th>Work order</th><th>Area</th><th>Status</th><th>Action</th></tr>'+r.orders.map(o=>'<tr><td>'+esc(o.reference)+' — '+esc(o.title)+'</td><td>'+esc(o.city)+', '+esc(o.state)+'</td><td>'+esc(o.status)+'</td><td><button type="button" data-id="'+esc(o.id)+'" class="choose">Select</button></td></tr>').join('')+'</table>';document.querySelectorAll('.choose').forEach(b=>b.onclick=()=>{currentId=b.dataset.id;$('message').textContent='Selected work order '+currentId})}catch(e){$('message').textContent=e.message}}$('form').onsubmit=async e=>{e.preventDefault();const keys=['title','city','state','postal_code','site_address','event_date','compensation','contact_name','contact_phone','incident_details','notes'],order={};keys.forEach(k=>order[k]=$(k).value);try{const r=await api('create',{order});currentId=r.order.id;$('message').textContent='Created '+r.order.reference+'. Search for an IC and send an offer.';await list()}catch(err){$('message').textContent=err.message}};$('search').onclick=async()=>{try{const r=await api('directory',{city:$('city').value,state:$('state').value});$('results').innerHTML=r.contractors.length?r.contractors.map(c=>'<p><strong>'+esc(c.business_name||'Independent Contractor')+'</strong> — '+esc(c.city)+', '+esc(c.state)+' — '+esc(c.service_area)+' <button type="button" data-user="'+esc(c.user_id)+'" class="offer">Send Offer</button></p>').join(''):'No active ICs matched this city/state search.';document.querySelectorAll('.offer').forEach(b=>b.onclick=async()=>{if(!currentId){$('message').textContent='Create or select a work order first.';return}b.disabled=true;try{await api('offer',{id:currentId,contractor_user_id:b.dataset.user});$('message').textContent='Branded IC offer email sent. Full assignment details will be available only after approval.';await list()}catch(e){$('message').textContent=e.message;b.disabled=false}})}catch(e){$('message').textContent=e.message}};list();</script></body></html>
