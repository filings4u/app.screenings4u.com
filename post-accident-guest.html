<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Post-Accident Report | workforce | screenings4u</title><meta name="robots" content="noindex,nofollow"><style>body{margin:0;font:16px Arial,sans-serif;background:#edf2f8;color:#17365f}header{background:#102f55;border-bottom:4px solid #f97300;padding:22px 5%}header img{width:210px;max-width:90%}main{max-width:820px;margin:30px auto;background:white;padding:32px;border-radius:14px;box-shadow:0 4px 20px #142e4e15}h1{margin:0 0 8px}p{line-height:1.5}label{font-weight:600;display:block;margin:18px 0 7px}input,textarea,select{box-sizing:border-box;width:100%;font:inherit;padding:12px;border:1px solid #b9c9d9;border-radius:7px}textarea{min-height:108px}button{background:#153e75;color:white;border:0;border-radius:7px;padding:14px 24px;margin-top:22px;font-size:16px;cursor:pointer}button:disabled{opacity:.6}.note{background:#fff7ed;border-left:4px solid #f97300;padding:14px}.error{color:#b42318}.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 20px}@media(max-width:650px){main{margin:10px;padding:18px}.grid{display:block}}</style></head><body><header><img src="https://elpbnytpciqnbexiaebp.supabase.co/storage/v1/object/public/enterprise_branding/workforce-dot2.png" alt="workforce | screenings4u"></header><main><h1>Post-Accident Information Report</h1><p id="intro">Validating your secure link…</p><p class="note">For documentation purposes. This form does not determine whether DOT testing is required. For a time-sensitive incident, contact your employer or designated representative immediately.</p><div id="message" role="status"></div><form id="report" hidden><div class="grid"><div><label for="incident_date">Accident date *</label><input type="date" id="incident_date" required></div><div><label for="incident_time">Accident time *</label><input type="time" id="incident_time" required></div></div><label for="incident_location">Location (city, state, road or address) *</label><input id="incident_location" required maxlength="500"><label for="driver_name">Driver / employee name *</label><input id="driver_name" required maxlength="150"><label for="description">Describe what happened *</label><textarea id="description" required maxlength="5000"></textarea><div class="grid"><div><label for="injuries">Were any injuries reported?</label><select id="injuries"><option value="unknown">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></div><div><label for="fatalities">Was there a fatality?</label><select id="fatalities"><option value="unknown">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></div><div><label for="tow_away">Was a vehicle towed due to disabling damage?</label><select id="tow_away"><option value="unknown">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></div><div><label for="citation">Was the driver issued a moving violation citation?</label><select id="citation"><option value="unknown">Unknown</option><option value="yes">Yes</option><option value="no">No</option></select></div><div><label for="drug_test">Post-accident drug test status</label><select id="drug_test"><option value="unknown">Unknown</option><option value="not_scheduled">Not yet scheduled</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select></div><div><label for="alcohol_test">Post-accident alcohol test status</label><select id="alcohol_test"><option value="unknown">Unknown</option><option value="not_scheduled">Not yet scheduled</option><option value="scheduled">Scheduled</option><option value="completed">Completed</option></select></div></div><label for="contact_phone">Callback number</label><input type="tel" id="contact_phone" maxlength="50"><label><input id="certification" type="checkbox" style="width:auto"> I certify that these details are accurate to the best of my knowledge. *</label><button id="send" type="submit">Submit Post-Accident Report</button></form></main><script>(function(){const endpoint="https://elpbnytpciqnbexiaebp.supabase.co/functions/v1/workforce-post-accident-guest";const token=new URLSearchParams(location.search).get("token");const form=document.getElementById("report"),msg=document.getElementById("message");async function call(action,data){const r=await fetch(endpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action,token,data})});const j=await r.json();if(!r.ok)throw Error(j.error||"Request failed");return j}if(!token){msg.textContent="A valid invitation link is required.";return}call("get").then(x=>{document.getElementById("intro").textContent="For "+x.company+" — invited recipient: "+x.name;form.hidden=false}).catch(e=>msg.textContent=e.message);form.onsubmit=async e=>{e.preventDefault();if(!form.reportValidity())return;if(!document.getElementById("certification").checked){msg.textContent="Please certify your answers.";return}const keys=["incident_date","incident_time","incident_location","driver_name","description","injuries","fatalities","tow_away","citation","drug_test","alcohol_test","contact_phone"];const data={};keys.forEach(k=>data[k]=document.getElementById(k).value);data.certification="yes";const b=document.getElementById("send");b.disabled=true;try{await call("submit",data);form.hidden=true;msg.textContent="Thank you. Your post-accident report was submitted successfully."}catch(err){msg.textContent=err.message;b.disabled=false}}}.toString()})()</script></body></html>
