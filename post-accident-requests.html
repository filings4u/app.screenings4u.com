f(!a)throw Error("Staff sign-in required");const client=window.DOT_AUTH_STATE?.supabase||window.DOTAuth?.supabase||window.dotSupabase;if(client?.auth){const{data}=await client.auth.getSession();if(data.session?.access_token)return data.session.access_token}for(const key of Object.keys(localStorage)){if(key.startsWith("sb-")&&key.endsWith("-auth-token")){try{const v=JSON.parse(localStorage.getItem(key));if(v.access_token)return v.access_token}catch{}}}throw Error("Unable to read staff session")}async function call(action,extra={}){const token=await jwt();const r=await fetch(endpoint,{method:"POST",headers:{"Authorization":"Bearer "+token,"Content-Type":"application/json"},body:JSON.stringify({action,...extra})});const v=await r.json();if(!r.ok)throw Error(v.error||"Request failed");return v}async function load(){try{const {requests}=await call("list");$("list").innerHTML='<table><tr><th>Recipient</th><th>Company</th><th>Status</th><th>Created</th></tr>'+requests.map(x=>'<tr><td>'+esc(x.recipient_name)+'<p>'+esc(x.recipient_email)+'</p></td><td>'+esc(x.company_name)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.created_at?.slice(0,10))+'</td></tr>').join('')+'</table>'}catch(e){$("msg").textContent=e.message}}$("refresh").onclick=load;$("f").onsubmit=async e=>{e.preventDefault();$("send").disabled=true;$("msg").textContent="Sending…";try{await call("create",{name:$("name").value,email:$("email").value,company:$("company").value});$("msg").textContent="Invitation email sent.";e.target.reset();await load()}catch(err){$("msg").textContent=err.message}finally{$("send").disabled=false}};load()}.toString()})()</script></body></html>
