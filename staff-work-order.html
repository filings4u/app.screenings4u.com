<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>My Assigned Work Orders | Screenings4u</title><style>body{margin:0;background:#f3f6fb;color:#18365c;font:15px/1.55 Arial,sans-serif}*{box-sizing:border-box}.wrap{max-width:1050px;margin:auto;padding:20px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}header img{width:175px;max-width:45vw}h1{font-size:27px}h2{font-size:20px}h3{font-size:16px;color:#315fa1}.box{background:#fff;border:1px solid #d9e3f0;border-radius:12px;padding:24px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid div{overflow-wrap:anywhere}.grid small{display:block;color:#687c93}button{padding:12px 18px;border:1px solid #c8d6e8;border-radius:8px;background:#fff;color:#24528e;min-height:44px;cursor:pointer;font-weight:600}.primary{background:#315da4;color:#fff}.actions{display:flex;gap:10px;flex-wrap:wrap}.work-card{display:flex;justify-content:space-between;align-items:center;gap:12px;border-top:1px solid #e5edf7;padding:16px 0}.document{border-top:5px solid #f47824}p{white-space:pre-wrap;overflow-wrap:anywhere}textarea{width:100%;min-height:95px;border:1px solid #c8d6e8;border-radius:8px;padding:12px;font:inherit}input[type=file]{width:100%;margin:12px 0}.muted{color:#657993}#message{min-height:22px}ul{padding-left:20px}@media(max-width:650px){.wrap{padding:12px}.box{padding:16px}.grid{grid-template-columns:1fr}.work-card{align-items:flex-start;flex-direction:column}.actions button{flex:1}header{align-items:flex-start;flex-direction:column}h1{font-size:23px}}@media print{body{background:#fff}.no-print,#list,#completion{display:none!important}.box{border:0;box-shadow:none}.wrap{max-width:none}.document{border:0}@page{margin:14mm}}</style></head><body><main class="wrap"><header><img src="/images/logo.png" alt="Screenings4u"><span>Staff Work Orders</span></header><h1>My Assigned Work Orders</h1><p id="message" role="status"></p><section id="list" class="box"><h2>Assignments</h2><div id="rows">Loading assigned work orders…</div></section><section id="detail" hidden><div class="actions no-print"><button id="back">← Back to assignments</button><button id="print">Print Work Order</button></div><article id="document" class="box document"></article><section id="completion" class="box"><h2>Complete work order</h2><p id="progress"></p><div class="actions"><button id="accept">Accept assignment</button><button id="start">Start work</button></div><h3>Job notes / completion notes</h3><textarea id="note" placeholder="Record what was done, times, results, issues or corrections"></textarea><div class="actions"><button id="saveNote">Save note</button><button id="submit" class="primary">Submit for admin review</button></div><h3>Required photos and documents</h3><input id="upload" type="file" accept="image/jpeg,image/png,image/webp,application/pdf" capture="environment"><button id="uploadButton">Upload document securely</button><div id="files"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/assets/js/dot-config.js"></script><script src="/assets/js/dot-api.js"></script><script src="/assets/js/staff-work-order.js?v=20261021-final-v2"></script></body></html>
