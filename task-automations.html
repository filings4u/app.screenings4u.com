<!doctype html><html class="dot-auth-pending"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><title>Task Automations | screenings4u</title><link rel="stylesheet" href="assets/css/dot-portal.css"><style>
.ar-wrap{max-width:1450px;margin:0 auto;padding:28px;color:#17365f;font:14px/1.5 Inter,Arial,sans-serif}.ar-wrap *{box-sizing:border-box}
.ar-wrap h1{font-size:26px;color:#325aa3;margin:0 0 6px}.ar-wrap h2{font-size:19px;color:#17365f;margin:0 0 8px}.ar-wrap h3{font-size:16px;color:#17365f}
.ar-wrap header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:15px;margin-bottom:20px}.ar-intro{max-width:850px}.ar-intro p,.ar-subtitle{color:#63758d;margin:5px 0 0}
.ar-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px}
.ar-wrap button,.ar-btn{display:inline-flex;align-items:center;justify-content:center;background:#325aa3;color:#fff;border:1px solid #325aa3;border-radius:8px;padding:10px 14px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}.ar-wrap button.secondary,.ar-btn.secondary{background:white;color:#325aa3;border-color:#cbd8e8}
.ar-card,#ruleForm{background:white;border:1px solid #d9e2ed;border-radius:12px;padding:22px;margin:16px 0;box-shadow:0 3px 12px #1f3a5a0b}
.ar-card p{color:#64748b}.ar-wrap label{display:grid;gap:6px;margin:0;font-weight:650;color:#304760;min-width:0}.ar-wrap input,.ar-wrap select,.ar-wrap textarea{display:block;width:100%;min-height:42px;padding:10px 12px;border:1px solid #c9d5e3;border-radius:8px;font:inherit;color:#17365f;background:white}
.ar-wrap textarea{min-height:100px;resize:vertical}.ar-wrap label:has(input[type=checkbox]){display:flex;align-items:center;gap:9px}.ar-wrap input[type=checkbox]{width:16px;min-height:16px;margin:0}
.ar-form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.ar-wide{grid-column:1/-1}.ar-timing{border:1px solid #dce6f3;border-radius:10px;padding:16px;background:#f6f9fd}
.ar-timing-grid{display:grid;grid-template-columns:1.4fr .8fr .8fr;gap:12px}.ar-muted{color:#667d97;font-size:13px}.ar-rule-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:12px}
.ar-rule-list .ar-card{margin:0}.ar-rule-list button{margin:6px 6px 0 0}
.ar-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.ar-metrics .ar-card{margin:4px 0;padding:15px}.ar-metrics .ar-card>div{font-size:24px;font-weight:750;color:#325aa3}
.ar-scroll{overflow-x:auto}.ar-wrap table{border-collapse:collapse;min-width:670px;width:100%}.ar-wrap th,.ar-wrap td{text-align:left;padding:11px;border-bottom:1px solid #e7edf4}
.ar-wrap th{background:#f6f9fd}.ar-wrap a{color:#325aa3}.ar-wrap #status{color:#496581}
#ruleForm[hidden],.ar-wrap [hidden]{display:none!important}@media(max-width:900px){.ar-metrics{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:700px){.ar-wrap{padding:18px}.ar-form-grid,.ar-timing-grid{grid-template-columns:1fr}.ar-wide{grid-column:auto}.ar-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style></head><body><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/dot-config.js"></script><script src="assets/js/dot-auth.js"></script><script src="assets/js/dot-api.js"></script><script src="assets/js/dot-shell.js?v=20261013-shared-task-manager"></script><script src="assets/js/task-automations.js?v=20261013-message-types-v4"></script></body></html>
